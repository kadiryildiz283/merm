[workspace]
resolver = "2"
members = [
    "crates/merm-cli",
    "crates/merm-core",
    "crates/merm-render",
    "crates/merm-ui",
    "crates/merm-ipc",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["merm contributors"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/merm-project/merm"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
log = "0.4"
env_logger = "0.11"
libc = "0.2"
