[workspace]
resolver = "2"
members = [
    "crates/merm-cli",
    "crates/merm-core",
    "crates/merm-render",
    "crates/merm-ui",
    "crates/merm-ipc",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80.0"
authors = ["Kadir Yildiz <kadiry.ra@gmail.com>", "merm contributors"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/kadiryildiz283/merm"
homepage = "https://github.com/kadiryildiz283/merm"
description = "Blazingly fast native Linux architecture studio & Mermaid viewer with Vim navigation, executable nodes, and Google Antigravity (AGY) integration"
readme = "README.md"
keywords = ["mermaid", "diagram", "architecture", "vim", "antigravity"]
categories = ["command-line-utilities", "development-tools", "visualization"]

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
log = "0.4"
env_logger = "0.11"
libc = "0.2"
syn = { version = "2.0", features = ["full", "visit", "extra-traits"] }
quote = "1.0"
uuid = { version = "1.8", features = ["v4", "serde"] }
tokio = { version = "1.38", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
notify = "6.1"
rayon = "1.10"
