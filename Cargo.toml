[workspace]
resolver = "2"
members = [
    "crates/merm-cli",
    "crates/merm-core",
    "crates/merm-render",
    "crates/merm-ui",
    "crates/merm-ipc",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80.0"
authors = ["Kadir Yildiz <kadiry.ra@gmail.com>", "merm contributors"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/kadiryildiz/merm"
homepage = "https://github.com/kadiryildiz/merm"
description = "Blazingly fast native Linux desktop viewer for Mermaid diagrams with Vim modal navigation and deep class diagram support"
readme = "README.md"
keywords = ["mermaid", "diagram", "viewer", "vim", "wayland"]
categories = ["command-line-utilities", "development-tools", "visualization"]

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
log = "0.4"
env_logger = "0.11"
libc = "0.2"
