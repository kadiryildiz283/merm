<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
    <defs>
        <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#1e1e2e"/>
            <stop offset="100%" stop-color="#11111b"/>
        </linearGradient>
        <linearGradient id="nodeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#313244"/>
            <stop offset="100%" stop-color="#181825"/>
        </linearGradient>
        <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#89b4fa"/>
            <stop offset="100%" stop-color="#cba6f7"/>
        </linearGradient>
    </defs>
    <!-- Base App Tile -->
    <rect width="128" height="128" rx="28" fill="url(#bgGrad)"/>
    <rect x="2" y="2" width="124" height="124" rx="26" fill="none" stroke="#45475a" stroke-width="2"/>
    
    <!-- Connected Diagram Nodes -->
    <!-- Relation Line -->
    <path d="M 40 44 C 40 76, 88 52, 88 84" fill="none" stroke="url(#accentGrad)" stroke-width="4" stroke-linecap="round"/>
    <polygon points="82 84, 88 94, 94 84" fill="#cba6f7"/>
    
    <!-- Top Class Node -->
    <rect x="20" y="24" width="48" height="36" rx="8" fill="url(#nodeGrad)" stroke="#89b4fa" stroke-width="2.5"/>
    <rect x="20" y="24" width="48" height="12" rx="8" fill="#45475a"/>
    <line x1="20" y1="36" x2="68" y2="36" stroke="#89b4fa" stroke-width="1.5"/>
    <circle cx="30" cy="30" r="2.5" fill="#a6e3a1"/>
    <circle cx="38" cy="30" r="2.5" fill="#fab387"/>
    <circle cx="46" cy="30" r="2.5" fill="#f38ba8"/>
    <line x1="26" y1="44" x2="48" y2="44" stroke="#cdd6f4" stroke-width="2" stroke-linecap="round"/>
    <line x1="26" y1="50" x2="60" y2="50" stroke="#f9e2af" stroke-width="2" stroke-linecap="round"/>

    <!-- Bottom Class Node -->
    <rect x="64" y="68" width="48" height="36" rx="8" fill="url(#nodeGrad)" stroke="#cba6f7" stroke-width="2.5"/>
    <rect x="64" y="68" width="48" height="12" rx="8" fill="#45475a"/>
    <line x1="64" y1="80" x2="112" y2="80" stroke="#cba6f7" stroke-width="1.5"/>
    <line x1="70" y1="88" x2="94" y2="88" stroke="#a6e3a1" stroke-width="2" stroke-linecap="round"/>
    <line x1="70" y1="94" x2="104" y2="94" stroke="#cdd6f4" stroke-width="2" stroke-linecap="round"/>
</svg>
